# KaawayAn Dashboard — deployment site config (single source for live ingest).
# Positions, headings and usb_serial are PLACEHOLDERS until surveyed.
# usb_serial may be a USB serial number or a COM port name (e.g. COM9).
#
# Point LOCALIZATION CLIs at this file:
#   python -m kaawayan.capture --config "config/site.toml" --seconds 10
#   python -m kaawayan.evaluate <trial_dir>   # uses trial/site.toml or the library default;
#                                           copy this file into the trial folder to pin it
# Calibration helpers are library functions in kaawayan.calibrate (no auto-write).
#
# SHA-256 of this file is stored with every --record trial.

convention_version     = 1
mic_spacing_m          = 0.10        # provisional until calibration (T3)
band_hz                = [300, 4000]
window_s               = 1.0
hop_s                  = 0.5
pair_tolerance_s       = 0.1
gate_min_confidence    = 0.3
gate_min_band_energy_db = -40.0
min_crossing_deg       = 30
phat_beta              = 0.25  # provisional, slice 4 decides

# Optional arena rectangle for the dashboard map (metres).
# If omitted, bounds = node positions plus 20% margin.
[arena]
x_min = -0.6
x_max = 3.6
y_min = -0.6
y_max = 4.8

[[nodes]]
node_id      = 1
usb_serial   = "REPLACE_WITH_NODE1_SERIAL"
board        = "xiao"
x_m          = 0.0
y_m          = 0.0
heading_deg  = 63.4               # aimed at area centre (1.5, 3.0)
tau0_s       = 0.0
channel_swap = false
mic_model    = "INMP441"

[[nodes]]
node_id      = 2
usb_serial   = "REPLACE_WITH_NODE2_SERIAL"
board        = "devkit"
x_m          = 3.0
y_m          = 0.0
heading_deg  = 116.6              # aimed at area centre (1.5, 3.0)
tau0_s       = 0.0
channel_swap = false
mic_model    = "INMP441"
