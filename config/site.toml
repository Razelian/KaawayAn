# KaawayAn site configuration – two-node setup (convention_version = 1)
# SI units in code; degrees only in heading_deg.
# SHA-256 of this file is stored with every trial result.
#
# NOTE: positions (x_m, y_m), heading_deg and usb_serial are PLACEHOLDERS
#       until surveyed on site.  Do not use for real trials before measuring.

convention_version     = 1
mic_spacing_m          = 0.10        # provisional until calibration (T3)
band_hz                = [300, 4000]
window_s               = 1.0
hop_s                  = 0.5
pair_tolerance_s       = 0.1
gate_min_confidence    = 0.3
gate_min_band_energy_db = -40.0
min_crossing_deg       = 30
phat_beta              = 0.25  # provisional, slice 4 decides

[[nodes]]
node_id      = 1
usb_serial   = "REPLACE_WITH_NODE1_SERIAL"
board        = "xiao"
x_m          = 0.0
y_m          = 0.0
heading_deg  = 63.4               # aimed at area centre (1.5, 3.0)
tau0_s       = 0.0
channel_swap = false
mic_model    = "INMP441"

[[nodes]]
node_id      = 2
usb_serial   = "REPLACE_WITH_NODE2_SERIAL"
board        = "devkit"
x_m          = 3.0
y_m          = 0.0
heading_deg  = 116.6              # aimed at area centre (1.5, 3.0)
tau0_s       = 0.0
channel_swap = false
mic_model    = "INMP441"
