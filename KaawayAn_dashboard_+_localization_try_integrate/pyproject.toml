[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaawayan-system"
version = "0.1.0"
description = "KaawayAn acoustic monitoring library, base station, and dashboard"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6",
  "scipy==1.16.1",
  "pyserial==3.5",
]

[project.optional-dependencies]
live = []
dash = ["streamlit==1.59.0"]
classifier = ["torch", "torchaudio"]
test = ["pytest==9.1.1", "pytest-cov==6.3.0"]

[project.scripts]
kaawayan-acceptance = "kaawayan.acceptance:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kaawayan*", "dashboard*", "database*", "model*"]

[tool.setuptools.package-data]
dashboard = ["ui_assets/**/*.html", "static/*"]
model = ["*.pt"]

[tool.coverage.run]
omit = ["kaawayan/tests/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "kaawayan/tests"]
pythonpath = ["."]
addopts = "-q --cov=kaawayan --cov-report=term-missing --cov-fail-under=60"
